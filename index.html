.overlay.pro .flight-nebula{position:absolute;border-radius:50%;filter:blur(18px);opacity:.5;mix-blend-mode:screen}
.overlay.pro .flight-nebula.a{width:260px;height:140px;left:-40px;bottom:20px;background:radial-gradient(circle at 60% 40%,rgba(108,169,255,.35),rgba(108,169,255,0));animation:nebulaFloatA 8s ease-in-out infinite}
.overlay.pro .flight-nebula.b{width:320px;height:160px;right:-40px;top:10px;background:radial-gradient(circle at 30% 50%,rgba(255,172,96,.28),rgba(255,172,96,0));animation:nebulaFloatB 9s ease-in-out infinite}
.overlay.pro .flight-stars,.overlay.pro .flight-stars:before,.overlay.pro .flight-stars:after{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:60px 60px;opacity:.26;animation:flightStars 18s linear infinite}
.overlay.pro .flight-stars.layer2,.overlay.pro .flight-stars.layer2:before,.overlay.pro .flight-stars.layer2:after{background-size:90px 90px;opacity:.14;animation-duration:26s}
.overlay.pro .flight-stars:before{background-position:15px 22px}
.overlay.pro .flight-stars:after{background-position:36px 10px}
.overlay.pro .flight-orbit{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.overlay.pro .flight-orbit .base{stroke:rgba(191,169,255,.22);stroke-width:2;stroke-dasharray:8 10;fill:none}
.overlay.pro .flight-orbit .glow{stroke:url(#flightPathGlow);stroke-width:4;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(201,164,255,.55));opacity:.92;stroke-dasharray:1 11;animation:pathPulse 3.1s ease-in-out infinite}
.overlay.pro .flight-origin,.overlay.pro .flight-destination{position:absolute;top:76%;width:clamp(66px,14vw,118px);aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center}
.overlay.pro .flight-origin{left:14%}
.overlay.pro .flight-destination{left:86%}
.overlay.pro .flight-origin .planet,.overlay.pro .flight-destination .planet{width:100%;height:100%;margin:0;position:relative;z-index:2}
.overlay.pro .flight-origin:before,.overlay.pro .flight-destination:before{content:'';position:absolute;inset:auto 10% -8px; height:18px;border-radius:50%;background:radial-gradient(circle,rgba(179,150,255,.34),rgba(0,0,0,0));filter:blur(8px);z-index:1}
.overlay.pro .flight-destination.solar-destination{width:clamp(82px,17vw,136px)}
.overlay.pro .flight-destination{animation:destPulse 2.1s ease-in-out infinite}
.overlay.pro .flight-arrival-ring{position:absolute;left:86%;top:46%;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,225,153,.82);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:arrivalRing 3.6s ease-out both}
.overlay.pro .flight-traveler{position:absolute;left:14%;top:47%;width:clamp(62px,12vw,110px);transform:translate(-50%,-50%);animation:flightHero 3.6s cubic-bezier(.22,.7,.18,1) both;filter:drop-shadow(0 10px 12px rgba(0,0,0,.28)) drop-shadow(0 0 16px rgba(163,111,252,.48));z-index:4}
.overlay.pro .flight-traveler .gengar{display:block;width:100%;height:auto;animation:heroWobble 3.6s ease-in-out both}
.overlay.pro .flight-traveler:before{content:'';position:absolute;left:50%;top:52%;width:58%;height:58%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(199,157,255,.48),rgba(199,157,255,0) 70%);filter:blur(8px);z-index:-1;animation:auraPulse 1.5s ease-in-out infinite}
.overlay.pro .flight-traveler:after{content:'';position:absolute;left:-110%;top:48%;width:180%;height:16%;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(196,161,255,.8),rgba(121,223,255,.28),rgba(255,255,255,0));transform:translateY(-50%) rotate(-8deg);border-radius:999px;filter:blur(4px);opacity:0;animation:heroTrail 3.6s linear both;z-index:-2}
.overlay.pro .flight-launch{position:absolute;left:14%;top:47%;width:30px;height:30px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(216,186,255,.9),rgba(216,186,255,0));filter:blur(4px);opacity:0;animation:launchBurst 3.6s ease-out both}
.overlay.pro .flight-caption{max-width:680px;text-align:center;color:#e8dcff}
@keyframes flightStars{from{transform:translateX(0)}to{transform:translateX(-120px)}}
@keyframes pathPulse{0%,100%{stroke-dashoffset:0;opacity:.7}50%{stroke-dashoffset:-20;opacity:1}}
@keyframes destPulse{50%{transform:translate(-50%,-50%) scale(1.05)}}
@keyframes auraPulse{50%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes launchBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}8%{opacity:1;transform:translate(-50%,-50%) scale(1.9)}18%,100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
@keyframes heroTrail{0%,14%{opacity:0;width:80%}24%,78%{opacity:1;width:180%}100%{opacity:0;width:100%}}
@keyframes arrivalRing{0%,70%{opacity:0;transform:translate(-50%,-50%) scale(.2)}82%{opacity:.95}100%{opacity:0;transform:translate(-50%,-50%) scale(4.2)}}
@keyframes nebulaFloatA{50%{transform:translate(24px,-12px) scale(1.05)}}
@keyframes nebulaFloatB{50%{transform:translate(-18px,14px) scale(.96)}}
@keyframes heroWobble{0%{transform:rotate(-8deg)}18%{transform:rotate(4deg)}42%{transform:rotate(9deg)}66%{transform:rotate(-6deg)}100%{transform:rotate(0deg)}}
@keyframes flightHero{0%{left:14%;top:47%;transform:translate(-50%,-50%) scale(.88)}12%{left:14%;top:49%;transform:translate(-50%,-50%) scale(.82,.72)}22%{left:20%;top:41%;transform:translate(-50%,-50%) scale(.92)}48%{left:46%;top:21%;transform:translate(-50%,-50%) scale(.96)}74%{left:71%;top:26%;transform:translate(-50%,-50%) scale(.92)}90%{left:84%;top:44%;transform:translate(-50%,-50%) scale(.9)}100%{left:86%;top:46%;transform:translate(-50%,-50%) scale(.92)}}
@media(max-width:560px){.overlay.pro .flight-pro{height:240px}.overlay.pro .flight-origin{left:13%}.overlay.pro .flight-destination{left:87%}.overlay.pro .flight-traveler{width:74px}@keyframes flightHero{0%{left:13%;top:47%;transform:translate(-50%,-50%) scale(.86)}12%{left:13%;top:49%;transform:translate(-50%,-50%) scale(.8,.72)}22%{left:19%;top:40%;transform:translate(-50%,-50%) scale(.91)}48%{left:45%;top:23%;transform:translate(-50%,-50%) scale(.94)}74%{left:72%;top:29%;transform:translate(-50%,-50%) scale(.9)}90%{left:85%;top:45%;transform:translate(-50%,-50%) scale(.88)}100%{left:87%;top:46%;transform:translate(-50%,-50%) scale(.9)}}}
/* SOLAR EXPEDITION — unified game presentation */

main#app{width:100%;max-width:1240px;padding:25px 24px 40px;margin:auto}main[data-screen="home"]{padding-top:20px}h1,h2,h3{font-family:var(--display);letter-spacing:-.035em}h2{font-weight:750}p{color:var(--muted);line-height:1.6}button{border-radius:9px;background:#222b40;border:1px solid #8290b642;color:#f2f1fb;font-weight:650;transition:background .18s,border-color .18s,transform .18s,box-shadow .18s}button:hover:not(:disabled){background:#343e59;border-color:#b2a0e7aa}button:active:not(:disabled){transform:translateY(1px) scale(.99)}button.primary{background:linear-gradient(115deg,#bfa7fd,#9d80e8);color:#141126;border:1px solid #d1bdff;box-shadow:0 5px 18px #9874dc33}button.primary:hover:not(:disabled){background:#d1baff;box-shadow:0 5px 24px #ad88ff66}button.gold{background:linear-gradient(120deg,#f7e1ad,#e3b96c);color:#291b15;border-color:#ffe9b5}button.gold:hover:not(:disabled){background:#ffe5ad}button.secondary{background:#141b2c;border-color:#8d9abc4d;color:#e3dfef}.eyebrow{font:650 .68rem var(--mono);letter-spacing:.17em;text-transform:uppercase;color:#e1cfae}.panel{border:1px solid var(--line);background:linear-gradient(145deg,#182031,#111725);box-shadow:0 16px 46px #0004;border-radius:14px}.status{border:1px solid #a1b0cd23;background:#0d1422;color:#dbe4f4;border-left:3px solid var(--mission-accent,#b49bfa);border-radius:7px}.footer{font:500 .65rem var(--mono);letter-spacing:.04em;color:#929bad;margin-top:28px}.test-note{color:#c4af84!important}.test-skip{border-style:dashed;background:#322c3b;color:#f0d59d}.test-skip:hover:not(:disabled){background:#48394a}

.atlas-route{margin:30px 0 0;padding:0}.route-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 14px}.route-heading .eyebrow{color:#9ca9c7}.route-heading h2{font-size:1.65rem;margin:5px 0 3px}.route-heading p{font-size:.83rem;margin:0}.route-count{font:700 1rem var(--mono);color:#e6cd9d}.atlas-route .atlas-map{grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.atlas-route .atlas-world.world{display:flex;flex-direction:column;align-items:stretch;position:relative;overflow:hidden;min-height:184px;padding:13px 13px 12px;border-radius:12px;background:radial-gradient(ellipse at 50% 34%,var(--world-dark),transparent 72%),#121927;border:1px solid #8190b22e;text-align:left;gap:7px;isolation:isolate}.atlas-route .atlas-world.world:before{position:absolute;content:'';inset:0;background-image:radial-gradient(#dfe8ff 1px,transparent 1px);background-size:35px 42px;opacity:.07;pointer-events:none;z-index:-1}.atlas-route .atlas-world.available{border-color:var(--world-tint);box-shadow:inset 0 0 20px #a394ec13,0 0 18px #c9b5ff13}.atlas-route .atlas-world.visited{border-color:#c7a96d55}.atlas-route .atlas-world.locked{opacity:.64;filter:saturate(.68)}.atlas-route .atlas-world:disabled{cursor:default}.atlas-route .atlas-world:not(:disabled):hover{transform:translateY(-3px);border-color:var(--world-tint);background-color:#243149}.world-meta{font:650 .63rem var(--mono);letter-spacing:.08em;color:#c1c9de;display:flex;justify-content:space-between;gap:6px;align-items:center}.world-state{font-size:.53rem!important;letter-spacing:.04em;color:#bbc3d3;background:#080d1888;padding:4px 5px;border-radius:4px;white-space:nowrap}.available .world-state{color:#eadfc7}.visited .world-state{color:#cfe9c8}.world-art{display:grid;place-items:center;min-height:86px;position:relative}.world-art:before{content:'';position:absolute;width:80%;height:30%;bottom:8%;border:1px solid #c5bfe222;transform:rotate(-20deg);border-radius:50%}.world-art .planet{width:94px!important;height:94px!important;filter:drop-shadow(0 4px 12px #0005)}.world-name{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;min-height:38px}.world-name b{font-size:1rem;color:#f6f5fc}.world-name small{font-size:.72rem!important;color:#b6bfd3;line-height:1.3}.world-arrow{position:absolute;right:12px;bottom:12px;font-size:.8rem;color:#b7c3dd}.home-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px}.home-bottom button{font-size:.75rem;padding:9px 12px}.home-bottom p{font-size:.73rem;margin:0}

function showIntro(startAfter=false){clearTimers();let slides=[{title:'Un secreto entre las estrellas',text:'En las fronteras del Sistema Solar, Gengar descubre una leyenda: en el Sol aguarda una recompensa extraordinaria. Nadie sabe qué esconde, pero el mensaje es claro. Debe viajar hasta allí.',planet:0,other:9},{title:'Nueve mundos. Nueve pruebas.',text:'Cada mundo protege el camino con un desafío distinto. La lógica, la estrategia, la memoria y la observación serán las herramientas de Gengar para continuar.',planet:4,other:3},{title:'El viaje es la aventura',text:'Tras superar cada misión, Gengar podrá saltar al siguiente destino. Si una prueba sale mal, podrá volver a intentarlo. El mapa conserva su progreso.',planet:6,other:7},{title:'El corazón del sistema',text:'Más allá de Mercurio, en el centro de todo, espera la recompensa. Gengar todavía no sabe qué encontrará. Solo existe una manera de descubrirlo.',planet:9,other:8}];let step=0;let div=document.createElement('div');div.className='intro-overlay';div.setAttribute('role','dialog');div.setAttribute('aria-modal','true');div.setAttribute('aria-label','Historia introductoria');document.body.append(div);setGameInert(true);const redraw=()=>{let s=slides[step];let scene=`<div class="intro-stage story-stage story-${step}">${starField()}<div class="story-world">${planet(s.planet)}</div><div class="story-satellite">${planet(s.other)}</div><div class="story-ghost">${gengar()}</div><div class="story-chapter">CAPÍTULO 0${step+1} / 04</div></div>`;div.innerHTML=`<div class="intro-card">${scene}<div class="intro-text"><div><div class="eyebrow">PRÓLOGO · 0${step+1}/04</div><h2>${s.title}</h2><div class="intro-caption"><p>${s.text}</p></div></div><div><div class="intro-step" aria-hidden="true">${slides.map((_,i)=>`<span class="step-dot ${i===step?'on':''}"></span>`).join('')}</div><div class="intro-actions">${button('Anterior','intro-prev','secondary',step===0)}${button(step===slides.length-1?(startAfter?'Empezar':'Finalizar'):'Siguiente','intro-next','primary')}</div><div class="actions" style="justify-content:flex-end;margin-bottom:0">${button('Omitir','intro-close','secondary')}</div></div></div></div>`;div.querySelector('[data-action=intro-next]').focus({preventScroll:true})};const close=()=>{save.storySeen=true;persist();div.remove();setGameInert(false);if(startAfter){save.completed===9?sun():openWorld(save.completed);window.scrollTo(0,0)}else{app.querySelector('[data-action=intro]')?.focus({preventScroll:true})}};redraw();div.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;audioCue('select');if(b.dataset.action==='intro-next'){if(step<slides.length-1){step++;redraw()}else close()}if(b.dataset.action==='intro-prev'&&step>0){step--;redraw()}if(b.dataset.action==='intro-close')close()});div.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close()}})}

function fly(i,skipped=false){clearTimers();const duration=reducedMotion()?1100:5200,origin=WORLDS[i][0],dest=WORLDS[i+1]?.[0]||'Sol';let div=document.createElement('div');div.className='overlay cinema';div.setAttribute('role','dialog');div.setAttribute('aria-modal','true');div.setAttribute('aria-label',`Viaje de ${origin} a ${dest}`);div.style.setProperty('--flight-time',duration+'ms');let streaks=range(30).map(k=>{let x=(k*89+13)%1000,y=(k*53+9)%490;return `<path d="M${x} ${y}l${30+k%5*11} ${-6-k%3*2}" stroke="#d6d7ff" opacity="${.15+k%4*.13}" stroke-width="${k%6===0?2:1}"/>`}).join('');div.innerHTML=`<div class="cinema-wrap"><div class="cinema-head"><div><div class="eyebrow">${skipped?'REGISTRO DE PRUEBAS':'MISIÓN COMPLETADA'} · TRÁNSITO ORBITAL</div><h2>${origin} <span>→</span> ${dest}</h2></div><span class="cinema-step">ETAPA ${String(i+1).padStart(2,'0')} / 09</span></div><div class="cinema-stage" style="--origin-glow:${ART[i][2]}99;--dest-glow:${ART[i+1][2]}99"><div class="cinema-starfield">${starField()}</div><div class="cinema-dust"></div><svg class="cinema-velocity" viewBox="0 0 1000 490" preserveAspectRatio="none" aria-hidden="true">${streaks}</svg><svg class="cinema-path" viewBox="0 0 1000 490" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="cinema-trail"><stop stop-color="#ad90fa"/><stop offset="1" stop-color="#ffe0a6"/></linearGradient></defs><path class="flight-route" d="M200 245 Q500 -30 800 245" fill="none" stroke-width="1.4"/><path class="active-route" pathLength="1" d="M200 245 Q500 -30 800 245" fill="none" stroke="url(#cinema-trail)" stroke-width="2.5"/></svg><div class="cinema-planet depart">${planet(i)}</div><div class="cinema-planet arrive ${i===8?'solar':''}">${planet(i+1)}</div><div class="cinema-burst"></div><div class="cinema-burst arrival"></div><div class="cinema-traveler">${gengar()}</div><div class="cinema-location from-label"><b>ORIGEN</b>${origin}</div><div class="cinema-location to-label"><b>DESTINO</b>${dest const ice={init:()=>({version:'sudoku1',values:[...SUDOKU_GRID],notes:{},sel:null,pencil:false,moves:0,msg:'Completa las nueve regiones de cristal. Los números grabados no se pueden modificar.'}),render:s=>{let blanks=SUDOKU_GRID.filter(x=>!x).length,filled=s.values.filter((x,i)=>x&&!SUDOKU_GRID[i]).length;return `<div class="sudoku-intro"><div class="eyebrow">Templo de hielo</div><h3>El sello de los nueve cristales</h3><p>Rellena cada fila, columna y bloque de 3 × 3 con los números del 1 al 9, sin repetir. Selecciona una casilla y elige un número. Usa las notas para anotar candidatos.</p></div>${status(s.msg+' · '+filled+'/'+blanks+' casillas · '+s.moves+' movimientos')}<div class="sudoku-grid" role="group" aria-label="Sudoku">${s.values.map((v,i)=>{let given=SUDOKU_GRID[i],selected=s.sel===i,peer=s.sel!==null&&sudokuPeers(s.sel).includes(i),same=s.sel!==null&&v&&v===s.values[s.sel],notes=s.notes[i]||[];return `<button class="sudoku-cell ${given?'given':''} ${selected?'chosen':''} ${peer?'peer':''} ${same?'same':''} ${sudokuConflict(s.values,i)?'conflict':''} ${(i%9===2||i%9===5)?'border-r':''} ${(Math.floor(i/9)===2||Math.floor(i/9)===5)?'border-b':''}" data-action="select:${i}" aria-label="Fila ${Math.floor(i/9)+1}, columna ${i%9+1}, ${v||'vacía'}" aria-pressed="${selected}" ${s.won?'disabled':''}>${v||`<span class="sudoku-notes">${range(9).map(k=>`<span>${notes.includes(k+1)?k+1:''}</span>`).join('')}</span>`}</button>`}).join('')}</div><div class="sudoku-pad">${range(9).map(i=>button(String(i+1),`digit:${i+1}`,'sudoku-number',s.won||s.sel===null||!!SUDOKU_GRID[s.sel])).join('')}</div><div class="actions center">${button(s.pencil?'✎ Notas activadas':'✎ Tomar notas','pencil',s.pencil?'primary':'',s.won)}${button('Borrar casilla','erase','',s.won||s.sel===null||!!SUDOKU_GRID[s.sel])}${button('Comprobar','validate','gold',s.won)}</div><p class="note">Las casillas fijas son doradas. Los números repetidos aparecen en rojo. No hay límite de tiempo.</p>`},act:(s,a)=>{i const FLEET_N=8,FLEET_CELLS=FLEET_N*FLEET_N;const sizes=[3,2,2,1,1,1];function fleetPlace(){while(true){let ships=[];for(let size of sizes){let candidates=[];for(let i=0;i<FLEET_CELLS;i++)for(let d of [1,FLEET_N]){let cells=range(size).map(j=>i+j*d);if(cells.some(x=>x>=FLEET_CELLS)||(d===1&&Math.floor(i/FLEET_N)!==Math.floor(cells.at(-1)/FLEET_N)))continue;if(cells.some(x=>ships.flat().some(y=>Math.abs(x%FLEET_N-y%FLEET_N)<=1&&Math.abs(Math.floor(x/FLEET_N)-Math.floor(y/FLEET_N))<=1)))continue;candidates.push(cells)}if(!candidates.length)break;ships.push(candidates[rand(candidates.length)])}if(ships.length===6)return ships}}const sunk=(ship,shots)=>ship.every(x=>shots.includes(x));function fleetShoot(s){let pending=s.mine.filter(ship=>!sunk(ship,s.enemyShots)&&ship.some(x=>s.enemyShots.includes(x))).flatMap(ship=>ship.filter(x=>s.enemyShots.includes(x))).flatMap(x=>[x-FLEET_N,x+FLEET_N,...(x%FLEET_N?[x-1]:[]),...(x%FLEET_N<FLEET_N-1?[x+1]:[])]).filter(x=>x>=0&&x<FLEET_CELLS&&!s.enemyShots.includes(x));let options=pending.length?pending:range(FLEET_CELLS).filter(x=>!s.enemyShots.includes(x));let x=options[rand(options.length)];s.enemyShots.push(x);let ship=s.mine.find(sh=>sh.includes(x));s.msg+=' · Rival: '+(ship?(sunk(ship,s.enemyShots)?'hundido':'tocado'):'agua');if(s.mine.every(ship=>sunk(ship,s.enemyShots))){s.lost=true;s.msg='El rival ha hundido tu flota. Vuelve a intentarlo.'}}
function hullArt(ship,i){let n=ship.length,k=ship.indexOf(i),vertical=n>1&&ship[1]-ship[0]===FLEET_N;let x0=k===0?4:0,x1=k===n-1?36:40;let d=n===1?'M20 4L32 14 32 30 20 37 8 30 8 14Z':`M${x0} ${k===0?20:10} ${k===0?11:x0} 10 H${k===n-1?29:x1} L${x1} ${k===n-1?20:10} V${k===n-1?20:30} L${k===n-1?29:x1} 30 H${k===0?11:x0} L${x0} ${k===0?20:30}Z`;return `<svg viewBox="0 0 40 40" aria-hidden="true"><g transform="${vertical?'rotate(90 20 20)':''}"><path d="${d}" fill="#9cb2cd" stroke="#c9def2" stroke-width="1.2"/><path d="M${x0+5} 20H${x1-5}" stroke="#2a4967" stroke-width="2"/><rect x="15" y="14" width="10" height="12" rx="2" fill="#4b6a89" stroke="#d3e5f0" stroke-width=".8"/><circle cx="20" cy="20" r="2.6" fill="#c7dcf0"/></g></svg>`}

function musicBeat(){if(!prefs.music||document.hidden)return;let c=audioCtx;if(!c||c.state!=='running')return;let t=c.currentTime+.04,notes=AMBIENT_CHORDS[musicStep++%AMBIENT_CHORDS.length];try{notes.forEach((n,i)=>tone(c,n,t+i*.18,2.8,.009,'sine',null,musicBus));tone(c,notes[0]/2,t,2.8,.009,'sine',null,musicBus)}catch{}}
function stopMusic(){if(musicBus&&audioCtx)musicBus.gain.setValueAtTime(0,audioCtx.currentTime);if(musicClock!==null){clearInterval(musicClock);musicClock=null}}
function startMusic(){stopMusic();if(!prefs.music||document.hidden)return;let c=getAudio();if(c){if(!musicBus){musicBus=c.createGain();musicBus.connect(c.destination)}musicBus.gain.setValueAtTime(1,c.currentTime);musicBeat();musicClock=setInterval(musicBeat,3100)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopMusic();if(audioCtx)audioCtx.suspend().catch(()=>{})}else if(prefs.music&&audioCtx)startMusic()});
function setGameInert(flag){app.inert=flag;document.querySelector('body>header').inert=flag}
function gameModal(title,inner,handler){if(document.querySelector('.game-modal,.intro-overlay,.overlay'))return;let old=document.activeElement,div=document.createElement('div');div.className='game-modal';div.setAttribute('role','dialog');div.setAttribute('aria-modal','true');div.setAttribute('aria-label',title);document.body.append(div);setGameInert(true);let close=()=>{div.remove();setGameInert(false);if(old?.isConnected)old.focus({preventScroll:true})};function draw(){div.innerHTML=`<div class="game-dialog"><div class="eyebrow">CENTRO DE CONTROL</div><h2>${esc(title)}</h2>${inner()}</div>`;div.querySelector('button:not(:disabled)')?.focus({preventScroll:true})}draw();div.addEventListener('click',e=>{let b=e.target.closest('[data-modal]');if(!b)return;let a=b.dataset.modal;if(a==='close')close();else handler(a,draw,close)});div.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close()}if(e.key==='Tab'){let f=[...div.querySelectorAll('button:not(:disabled)')];if(!f.length)return;if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}})}
function showSettings(){let row=(label,desc,enabled,act,on='Sí',off='No')=>`<div class="setting-row"><div><b>${label}</b><small>${desc}</small></div><button class="setting-toggle" aria-pressed="${enabled}" data-modal="${act}">${enabled?on:off}</button></div>`;gameModal('Ajustes',()=>`<p>Personaliza tu experiencia. Las preferencias se guardan en este navegador.</p>${row('Efectos sonoros','Confirmaciones, victorias y saltos.',prefs.sfx,'sfx','Activo','Inactivo')}${row('Música ambiental','Atmósfera espacial original sintetizada.',prefs.music,'music','Activa','Inactiva')}${row('Movimiento reducido','Elimina animaciones decorativas y acorta los viajes.',prefs.motion==='reduced','motion','Reducido','Sistema')}${document.fullscreenEnabled?`<div class="setting-row"><div><b>Pantalla completa</b><small>Oculta la interfaz del navegador si es compatible.</small></div><button class="setting-toggle" data-modal="fullscreen">${document.fullscreenElement?'Salir':'Entrar'}</button></div>`:''}<div class="actions"><button class="primary" data-modal="close">Volver al juego</button></div><p class="hint">El sonido solo comienza tras una interacción; puedes silenciarlo en cualquier momento.</p>`,(a,draw,close)=>{if(a==='sfx'){prefs.sfx=!prefs.sfx;audioCue('select')}if(a==='music'){prefs.music=!prefs.music;if(prefs.music)startMusic();else stopMusic()}if(a==='motion')prefs.motion=prefs.motion==='reduced'?'system':'reduced';if(a==='fullscreen'){let prom=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();prom.then(draw).catch(()=>{});return}applyPrefs();draw()})}
function confirmGame(title,message,yes){gameModal(title,()=>`<p>${esc(message)}</p><div class="actions"><button data-modal="close" class="secondary">Cancelar</button><button data-modal="confirm" class="danger">Confirmar</button></div>`,(a,draw,close)=>{if(a==='confirm'){close();yes()}})}
applyPrefs();
const games=[ice,fleet,memory,domino,mus,mines,room,master,pipes];function dispatch(a){if(a==='map'){home();window.scrollTo(0,0);return}if(a==='route')return showRoute();if(a==='intro')return showIntro(false);if(a==='start'){if(prefs.music)startMusic();if(!save.storySeen&&save.completed===0)return showIntro(true);save.completed===9?sun():openWorld(save.completed);window.scrollTo(0,0);return}if(a==='sun')return sun();if(a.startsWith('world:')){openWorld(+a.split(':')[1]);window.scrollTo(0,0);return}if(a==='letter'&&save.completed===9){save.letter=true;persist();return sun()}if(a==='reset'){return confirmGame('Reiniciar aventura','Se borrará el progreso de esta partida. Esta acción no se puede deshacer.',()=>{save={completed:0,games:{},letter:false,storySeen:false};persist();home();window.scrollTo(0,0)})}if(active<0)return;if(a==='test-skip'&&TEST_MODE&&!g.won){if(active===save.completed){g.skipped=true;save.completed++;persist()}return fly(active,true)}if((a==='next'||a==='next-bottom')&&g.won)return fly(active);if(a==='retry'){return confirmGame('Reiniciar desafío','Se perderá la partida de este desafío. El progreso de los demás planetas se conserva.',()=>{let i=active;delete save.games[i];openWorld(i)})}if(g.won)return;let oldPhase=active===4?g.phase:null;games[active].act(g,a);persist();if(!(active===2&&g.phase==='show'))render();playVenueMotion(a,oldPhase)}
function playVenueMotion(a,oldPhase){if(reducedMotion()||!Element.prototype.animate)return;if(active===8&&a.startsWith('pipe:')){let el=[...app.querySelectorAll('.reactor-grid .pipe')].find(b=>b.dataset.action===a)?.querySelector('.reactor-circuit');el?.animate([{transform:'rotate(-90deg)'},{transform:'rotate(0deg)'}],{duration:230,easing:'cubic-bezier(.2,.75,.25,1)'})}else if(active===7&&a==='check'){let rows=app.querySelectorAll('.vault-row.submitted');rows[rows.length-1]?.animate([{filter:'brightness(1.7)'},{filter:'brightness(1)'}],{duration:420,easing:'ease-out'})}else if(active===4&&(a==='newhand'||a==='mus'||(oldPhase!=='reveal'&&g.phase==='reveal'))){app.querySelectorAll('.salon-mus .mus-seat.you .mus-card').forEach((el,i)=>el.animate([{opacity:.3,transform:'translateY(8px) scale(.98)'},{opacity:1,transform:'none'}],{duration:230,delay:30*i,easing:'ease-out'}))}}
app.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b&&!b.disabled){if(prefs.music&&musicClock===null)startMusic();audioCue('select');dispatch(b.dataset.action)}});app.addEventListener('submit',e=>{if(e.target.id==='safeform'){e.preventDefault();dispatch('code:'+$('#code').value)}});$('#home').onclick=()=>{audioCue('select');showRoute()};$('#settings').onclick=showSettings;document.addEventListener('keydown',e=>{if(active!==0||!g||g.won||document.querySelector('.overlay,.intro-overlay,.game-modal'))return;let a={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Backspace:'erase',Delete:'erase'}[e.key]||(/^[1-9]$/.test(e.key)?'digit:'+e.key:null);if(a){e.preventDefault();dispatch(a)}});// Interrupted memory playback can always be started again.
if(save.games[2]?.phase==='show')save.games[2].phase='ready';if(typeof save.storySeen!=='boolean')save.storySeen=false;home();
</script></body></html>
